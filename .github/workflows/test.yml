name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Check repository hygiene and reachable history
        run: python3 scripts/check-repository-hygiene.py --tracked-only --history

      - name: Verify pinned constitutional source
        run: bash scripts/verify-constitution-source.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - name: Run audit invariant profile with three seeds
        # Foundry groups predicates per contract; retain the prior aggregate handler-call budget.
        run: |
          for invariant_seed in 0x709 0x110338 0x381; do
            FOUNDRY_PROFILE=audit forge test --match-path 'test/invariant/*.t.sol' --fuzz-seed "$invariant_seed" -vvv
          done

      - name: Run Forge coverage
        # The full optimized test run includes the 1,000-candidate stress test; instrument the equivalent 100-candidate path.
        run: forge coverage --report summary --no-match-test test_Governance_OpenAdmissionFinalizes1000CandidatesInBoundedChunks

      - name: Install Python for Slither
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install pinned Slither
        run: CC=gcc python -m pip install --disable-pip-version-check slither-analyzer==0.11.6 crytic-compile==0.4.2

      - name: Run full Slither report and enforce triaged baseline
        # Unsuppressed output plus reviewed severity counts and normalized finding identities.
        run: python scripts/check-slither-baseline.py

      - name: Verify current documentation and exact ABI parity
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s test/reference -p 'test_*.py'
          python scripts/check-docs.py --check-abis
